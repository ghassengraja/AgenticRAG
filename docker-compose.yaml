name: vllm

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: qwen38-vllm
    runtime: nvidia
    ipc: host
    ports:
      - "8123:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 3
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.cache/vllm:/root/.cache/vllm
      - ~/.triton:/root/.triton
    environment:
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_USE_V2_MODEL_RUNNER=0
      - VLLM_USE_FLASHINFER_SAMPLER=0
      - PYTHONFAULTHANDLER=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - RedHatAI/Qwen3.8-27B-INT4
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "${VLLM_CHAT_GPU_MEMORY_UTILIZATION:-0.82}"
      - --kv-cache-dtype
      - fp8
      - --max-model-len
      - "16384"
      - --max-num-batched-tokens
      - "1024"
      - --max-num-seqs
      - "8"
      - --enforce-eager
      - --language-model-only
      - --attention-config
      - '{"backend": "TRITON_ATTN"}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3

  vllm-embeddings:
    image: vllm/vllm-openai:latest
    container_name: qwen-38-embedding
    runtime: nvidia
    ipc: host
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "8124:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - Qwen/Qwen3-Embedding-0.6B
      - --runner
      - pooling
      - --max-model-len
      - "1024"
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - "${VLLM_EMBEDDINGS_GPU_MEMORY_UTILIZATION:-0.12}"

  redis:
    image: redis:8.6.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
